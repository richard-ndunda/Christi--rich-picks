
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christi Rich Picks Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
    h1 { color: #176b45; }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      background: #176b45;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Christi Rich Picks</h1>
    <h2>Admin Dashboard</h2>
    <p>Manage your affiliate products here.</p>

    <form>
      <input type="text" placeholder="Product name">
      <input type="text" placeholder="Product image URL">
      <input type="number" placeholder="Product price">
      <input type="url" placeholder="Affiliate link">
      <textarea placeholder="Product description"></textarea>
      <button type="button">Add Product</button>
    </form>
  </div>
</body>
  </html>
