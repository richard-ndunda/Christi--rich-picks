<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <header class="header">
          <p class="eyebrow">Daily planner</p>
          <h1>To-do List</h1>
        </header>

        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Add new task</label>
          <input
            id="todo-input"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
          />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>

          <button id="clear-completed" class="secondary-btn" type="button">
            Clear completed
          </button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <footer class="status-bar">
          <span id="items-left">0 items left</span>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
